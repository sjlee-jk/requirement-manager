<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>요구사항 현황</title>
<!--
  고객 조회 화면 (SPEC 6). 단일 파일, 외부 라이브러리·CDN·폰트 없음.
  주소: index.html#c=<공개ID>&k=<키>  →  data/<공개ID>.json(암호문)을 받아 브라우저에서 복호화한다.
  # 뒤 값은 서버로 전송되지 않는다. 업체명은 일부러 표시하지 않는다.
  데이터 형식·복호화 방식은 AGENTS.md 수정 금지 영역이다.
-->
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --border: #e3e6eb;
    --border-strong: #cfd4dc;
    --text: #1f2328;
    --sub: #6b7280;
    --muted: #9aa1ab;
    --primary: #1c70d6;
    --primary-soft: #e8f1fd;
    --inquiry: #7c4dc4;
    --inquiry-soft: #f1ebfa;
    --success: #16803d;
    --success-soft: #e8f5ec;
    --warning: #b46e00;
    --danger: #cd3434;
    --danger-soft: #fdeeee;
    --teal: #0d8a80;
    --radius: 10px;
    --shadow: 0 8px 28px rgba(15, 23, 42, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Pretendard", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1480px; margin: 0 auto; padding-left: 28px; padding-right: 28px; }

  /* 상단 */
  .topbar { border-bottom: 1px solid var(--border); background: var(--bg); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  .updated { color: var(--sub); font-size: 13px; white-space: nowrap; }
  .preview-bar { background: #fff8e6; color: #7a5200; border-bottom: 1px solid #f1dfb0; font-size: 13px; text-align: center; padding: 6px 16px; }

  main.wrap { padding-top: 24px; padding-bottom: 40px; }
  .top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); min-width: 0; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
  .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .card-head .count { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border-radius: 999px; padding: 1px 9px; }
  .card-head .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  .card-body { padding: 6px 20px 14px; max-height: 300px; overflow: auto; }
  .empty-text { color: var(--muted); padding: 18px 0; text-align: center; font-size: 13px; }

  /* 공지 */
  .notice { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f0f2f5; }
  .notice:last-child { border-bottom: 0; }
  .notice .msg { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .notice .date { color: var(--muted); font-size: 12px; white-space: nowrap; padding-top: 2px; }
  .notice.important .msg { font-weight: 600; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; white-space: nowrap; }
  .tag.important { color: var(--danger); background: var(--danger-soft); }
  .tag.dev { color: var(--primary); background: var(--primary-soft); }
  .tag.inquiry { color: var(--inquiry); background: var(--inquiry-soft); }

  /* 최근 완료 */
  .recent { display: grid; grid-template-columns: 50px 62px 1fr; gap: 10px; align-items: baseline; padding: 10px 8px; margin: 0 -8px; border-radius: 6px; cursor: pointer; user-select: none; }
  .recent:hover { background: var(--surface); }
  .recent:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  .recent .date { color: var(--success); font-weight: 700; font-size: 13px; }
  .recent .no { font-weight: 700; font-size: 13px; }
  .recent .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 전체 목록 */
  .list-head { flex-wrap: wrap; }
  .summary { display: flex; gap: 14px; color: var(--sub); font-size: 13px; margin-left: 6px; }
  .summary b { color: var(--text); }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; flex-wrap: wrap; }
  .search { position: relative; flex: 0 1 420px; min-width: 220px; }
  .search input { width: 100%; height: 38px; padding: 0 12px 0 36px; border: 1px solid var(--border-strong); border-radius: 8px; outline: none; background: var(--bg); }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
  .btn { height: 38px; padding: 0 14px; border: 1px solid var(--border-strong); background: var(--bg); border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface); }
  .btn:disabled { color: var(--muted); cursor: default; background: var(--bg); }
  .result { color: var(--sub); font-size: 13px; margin-left: auto; }
  .active-filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 10px; }
  .active-filters:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 3px 6px 3px 10px; }
  .chip button { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; }

  .table-wrap { overflow: auto; max-height: calc(100vh - 140px); border-top: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }
  table { width: 100%; border-collapse: collapse; min-width: 1120px; table-layout: fixed; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--sub); font-size: 13px; font-weight: 700; text-align: left; border-bottom: 1px solid var(--border); padding: 0; }
  .th { display: flex; align-items: center; height: 42px; }
  .th-sort { flex: 1; height: 100%; text-align: left; border: 0; background: transparent; padding: 0 6px 0 14px; cursor: pointer; font-weight: 700; color: inherit; white-space: nowrap; }
  .th-sort:hover { color: var(--text); }
  .th-sort .arrow { font-size: 10px; margin-left: 4px; color: var(--primary); }
  .th-filter { width: 30px; height: 30px; margin-right: 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .th-filter:hover { background: #eceff3; color: var(--text); }
  .th-filter.on { color: #fff; background: var(--primary); }
  tbody td { padding: 11px 14px; border-bottom: 1px solid #eef0f3; vertical-align: top; word-break: break-word; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #fafbfc; }
  tbody tr.closed td { color: var(--muted); }
  td.no { font-weight: 700; white-space: nowrap; }
  td.title { font-weight: 600; }
  tr.closed td.title { font-weight: 400; }
  td.pre { white-space: pre-wrap; }
  .reply-line { white-space: pre-wrap; }
  .reply-line + .reply-line { margin-top: 4px; }
  .reply-line .rd { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .status { font-weight: 700; white-space: nowrap; }
  .status::before { content: "●"; margin-right: 5px; font-size: 10px; vertical-align: 1px; }
  .prio-urgent { color: var(--danger); font-weight: 700; }
  .prio-high { color: #d66014; font-weight: 700; }
  .no-rows { padding: 34px 0; text-align: center; color: var(--muted); }
  .footnote { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 22px; }

  /* 필터 팝업 */
  .pop { position: absolute; z-index: 30; width: 270px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 12px; }
  .pop h3 { margin: 0 0 8px; font-size: 13px; color: var(--sub); }
  .pop input[type=text], .pop input[type=date] { width: 100%; height: 34px; border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 10px; outline: none; }
  .pop input:focus { border-color: var(--primary); }
  .pop .options { max-height: 240px; overflow: auto; margin: 8px 0; border-top: 1px solid #f0f2f5; padding-top: 6px; }
  .pop label { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; font-size: 13.5px; }
  .pop label .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .pop .all { font-weight: 700; border-bottom: 1px solid #f0f2f5; padding-bottom: 6px; margin-bottom: 2px; }
  .pop .range { display: grid; gap: 6px; }
  .pop .range span { color: var(--sub); font-size: 12px; }
  .pop .actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .pop .actions .btn { height: 32px; padding: 0 12px; font-size: 13px; }
  .pop .note { color: var(--muted); font-size: 12px; margin-top: 6px; }

  /* 상세 */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, .38); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal[hidden] { display: none; }
  .panel { background: var(--bg); width: min(760px, 100%); max-height: 88vh; overflow: auto; border-radius: 12px; box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  .panel-head h3 { margin: 0; font-size: 18px; line-height: 1.4; flex: 1; word-break: break-word; }
  .panel-head .no { color: var(--sub); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .close { border: 0; background: transparent; cursor: pointer; font-size: 22px; line-height: 1; color: var(--sub); padding: 2px 6px; border-radius: 6px; }
  .close:hover { background: var(--surface); }
  .panel-body { padding: 18px 24px 24px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 16px; background: var(--surface); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
  .meta dt { color: var(--sub); font-size: 12px; }
  .meta dd { margin: 2px 0 0; font-weight: 600; }
  .section-title { font-size: 13px; color: var(--sub); font-weight: 700; margin: 0 0 8px; }
  .content-box { white-space: pre-wrap; word-break: break-word; margin: 0 0 20px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { border-left: 2px solid var(--primary-soft); padding: 0 0 14px 14px; position: relative; }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
  .timeline .when { color: var(--sub); font-size: 12px; }
  .timeline .msg { white-space: pre-wrap; word-break: break-word; }

  /* 상태 화면 */
  .state { max-width: 520px; margin: 80px auto; text-align: center; color: var(--sub); padding: 0 20px; }
  .state h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }

  @media (max-width: 900px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    main.wrap { padding-top: 16px; }
    .top-grid { grid-template-columns: 1fr; }
    .topbar h1 { font-size: 18px; }
    .result { margin-left: 0; width: 100%; }
    .search { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div id="previewBar" class="preview-bar" hidden>미리보기 화면입니다. 실제 고객 주소로 게시된 화면과 내용은 같습니다.</div>
<header class="topbar">
  <div class="wrap">
    <h1>요구사항 현황</h1>
    <div class="updated" id="updated"></div>
  </div>
</header>

<div class="state" id="state"><p>불러오는 중…</p></div>

<main class="wrap" id="app" hidden>
  <section class="top-grid">
    <article class="card">
      <div class="card-head"><h2>공지사항</h2><span class="count" id="noticeCount"></span></div>
      <div class="card-body" id="noticeList"></div>
    </article>
    <article class="card">
      <div class="card-head"><h2>최근 7일 완료</h2><span class="count" id="recentCount"></span><span class="hint">더블클릭하면 상세 보기</span></div>
      <div class="card-body" id="recentList"></div>
    </article>
  </section>

  <section class="card">
    <div class="card-head list-head">
      <h2>전체 요청·문의</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="검색 — 띄어 쓰면 모두 포함 (예: BOM 김철수)" autocomplete="off">
      </div>
      <button class="btn" id="resetAll" type="button">검색·필터 초기화</button>
      <div class="result" id="result"></div>
    </div>
    <div class="active-filters" id="activeFilters"></div>
    <div class="table-wrap">
      <table>
        <colgroup id="cols"></colgroup>
        <thead><tr id="headRow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="no-rows" id="noRows" hidden>조건에 맞는 항목이 없습니다.</div>
    </div>
  </section>
  <p class="footnote">이 페이지는 조회 전용입니다. 요청·문의는 담당자에게 전달해 주세요. 행을 더블클릭하면 상세 내용을 볼 수 있습니다.</p>
</main>

<div class="pop" id="pop" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="panel-head">
      <div style="flex:1;min-width:0">
        <div class="no" id="mNo"></div>
        <h3 id="mTitle"></h3>
      </div>
      <button class="close" id="mClose" type="button" aria-label="닫기">×</button>
    </div>
    <div class="panel-body">
      <dl class="meta" id="mMeta"></dl>
      <p class="section-title">요청 내용</p>
      <div class="content-box" id="mContent"></div>
      <p class="section-title" id="mReplyTitle">답변</p>
      <ul class="timeline" id="mReplies"></ul>
    </div>
  </div>
</div>

<!--RM_PREVIEW_DATA-->
<script>
(function () {
  'use strict';

  // ───────── 표시 이름 (관리 프로그램 Labels와 같게) ─────────
  var STATUS = { received: '접수', reviewing: '검토중', in_progress: '진행중', on_hold: '보류', done: '완료', rejected: '반려/불가' };
  var STATUS_COLOR = { received: '#4b5563', reviewing: 'var(--teal)', in_progress: 'var(--primary)', on_hold: 'var(--warning)', done: 'var(--success)', rejected: 'var(--muted)' };
  var PRIORITY = { low: '낮음', normal: '보통', high: '높음', urgent: '긴급' };
  var PRIORITY_RANK = { urgent: 3, high: 2, normal: 1, low: 0 };
  var EMPTY = '(없음)';

  function typeLabel(r) { return r.type === 'inquiry' ? '문의' : '요청'; }
  function isClosed(r) { return r.status === 'done' || r.status === 'rejected'; }
  function statusLabel(r) {
    if (r.type === 'inquiry') return r.status === 'done' ? '답변 완료' : '미답변';
    return STATUS[r.status] || r.status;
  }
  function priorityLabel(r) { return r.type === 'inquiry' ? '' : (PRIORITY[r.priority] || ''); }
  function repliesText(r) { return r.replies.map(function (x) { return x.message; }).join('\n'); }

  // ───────── 열 정의: No를 제외한 모든 열에 필터 ─────────
  // filter: set = 값 목록 체크, text = 포함 검색(AND), date = 기간
  var COLUMNS = [
    { key: 'no', label: 'No', width: '78px', filter: null, value: function (r) { return r.no; } },
    { key: 'type', label: '구분', width: '74px', filter: 'set', value: typeLabel },
    { key: 'title', label: '제목', width: '17%', filter: 'text', value: function (r) { return r.title; } },
    { key: 'content', label: '요청 내용', width: '27%', filter: 'text', value: function (r) { return r.content; } },
    { key: 'replies', label: '답변', width: '29%', filter: 'text', value: repliesText },
    { key: 'requester', label: '요청자', width: '96px', filter: 'set', value: function (r) { return r.requester; } },
    { key: 'requestDate', label: '요청일', width: '112px', filter: 'date', value: function (r) { return r.requestDate; } },
    { key: 'priority', label: '중요도', width: '90px', filter: 'set', value: priorityLabel },
    { key: 'status', label: '상태', width: '112px', filter: 'set', value: statusLabel }
  ];

  var data = null;
  var rows = [];
  var filters = {};          // key → Set | string | {from,to}
  var sort = null;           // {key, dir}
  var searchText = '';
  var popKey = null;

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ───────── 데이터 불러오기·복호화 ─────────
  function b64url(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decrypt(envelope, key) {
    if (!envelope || envelope.v !== 1 || envelope.alg !== 'A256GCM') throw new Error('format');
    var cryptoKey = await crypto.subtle.importKey('raw', b64url(key), { name: 'AES-GCM' }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64url(envelope.iv) }, cryptoKey, b64url(envelope.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function fail(title, message) {
    var s = $('state');
    s.innerHTML = '';
    s.appendChild(el('h2', null, title));
    s.appendChild(el('p', null, message));
  }

  async function load() {
    var envelope, key;
    var preview = $('rm-preview');
    if (preview) {
      var p = JSON.parse(preview.textContent);
      envelope = p.envelope;
      key = p.key;
      $('previewBar').hidden = false;
    } else {
      var params = new URLSearchParams(location.hash.slice(1));
      var c = params.get('c'), k = params.get('k');
      if (!c || !k || !/^[a-z0-9]{12}$/.test(c)) {
        return fail('주소가 올바르지 않습니다', '받은 주소 전체(# 뒤까지)를 다시 확인해 주세요.');
      }
      var res;
      try {
        res = await fetch('data/' + c + '.json?t=' + Date.now(), { cache: 'no-store' });
      } catch (e) {
        return fail('데이터를 불러오지 못했습니다', '잠시 후 새로고침해 주세요.');
      }
      if (res.status === 404) return fail('주소가 만료되었거나 사용할 수 없습니다', '담당자에게 문의해 주세요.');
      if (!res.ok) return fail('데이터를 불러오지 못했습니다', '잠시 후 새로고침해 주세요.');
      envelope = await res.json();
      key = k;
    }
    if (!window.crypto || !crypto.subtle) {
      return fail('이 브라우저에서는 열 수 없습니다', '최신 Chrome 또는 Edge에서 열어 주세요.');
    }
    try {
      data = await decrypt(envelope, key);
    } catch (e) {
      return fail('주소가 올바르지 않거나 만료되었습니다', '담당자에게 문의해 주세요.');
    }
    rows = data.requests || [];
    $('state').hidden = true;
    $('app').hidden = false;
    renderAll();
  }

  // ───────── 날짜 ─────────
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(iso, withTime) {
    if (!iso) return '';
    var d = new Date(iso);
    var s = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    return withTime ? s + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : s;
  }
  function mmdd(iso) { var d = new Date(iso); return pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // ───────── 렌더링 ─────────
  function renderAll() {
    $('updated').textContent = '마지막 업데이트 ' + fmt(data.publishedAt, true);
    renderNotices();
    renderRecent();
    renderHead();
    renderSummary();
    renderRows();
  }

  function renderNotices() {
    var list = $('noticeList'), notices = data.notices || [];
    list.innerHTML = '';
    $('noticeCount').textContent = notices.length ? notices.length : '';
    $('noticeCount').hidden = !notices.length;
    if (!notices.length) { list.appendChild(el('div', 'empty-text', '등록된 공지가 없습니다.')); return; }
    notices.forEach(function (n) {
      var item = el('div', 'notice' + (n.isImportant ? ' important' : ''));
      var msg = el('div', 'msg');
      if (n.isImportant) msg.appendChild(el('span', 'tag important', '중요'));
      msg.appendChild(document.createTextNode(n.content));
      item.appendChild(msg);
      item.appendChild(el('div', 'date', n.noticeDate.slice(5)));
      list.appendChild(item);
    });
  }

  function renderRecent() {
    var list = $('recentList');
    var since = Date.now() - 7 * 24 * 3600 * 1000;
    var recent = rows.filter(function (r) { return r.status === 'done' && r.completedAt && new Date(r.completedAt).getTime() >= since; })
      .sort(function (a, b) { return new Date(b.completedAt) - new Date(a.completedAt); });
    list.innerHTML = '';
    $('recentCount').textContent = recent.length;
    $('recentCount').hidden = !recent.length;
    if (!recent.length) { list.appendChild(el('div', 'empty-text', '최근 7일 동안 완료된 항목이 없습니다.')); return; }
    recent.forEach(function (r) {
      var item = el('div', 'recent');
      item.tabIndex = 0;
      item.title = '더블클릭하면 상세 보기';
      item.appendChild(el('span', 'date', mmdd(r.completedAt)));
      var no = el('span', 'no', r.no);
      no.style.color = r.type === 'inquiry' ? 'var(--inquiry)' : 'var(--primary)';
      item.appendChild(no);
      var title = el('span', 'title');
      title.appendChild(el('span', 'tag ' + (r.type === 'inquiry' ? 'inquiry' : 'dev'), typeLabel(r)));
      title.appendChild(document.createTextNode(r.title));
      item.appendChild(title);
      bindOpen(item, r);
      list.appendChild(item);
    });
  }

  // 마우스는 더블클릭, 터치는 한 번 탭으로 상세를 연다 (휴대폰에서 더블탭은 확대로 동작하므로).
  function bindOpen(node, r) {
    node.addEventListener('dblclick', function () { openDetail(r); });
    node.addEventListener('pointerup', function (e) { if (e.pointerType === 'touch') openDetail(r); });
    node.addEventListener('keydown', function (e) { if (e.key === 'Enter') openDetail(r); });
  }

  function renderSummary() {
    var open = rows.filter(function (r) { return !isClosed(r); }).length;
    var done = rows.filter(function (r) { return r.status === 'done'; }).length;
    var s = $('summary');
    s.innerHTML = '';
    [['전체', rows.length], ['미완료', open], ['완료', done]].forEach(function (x) {
      var span = el('span', null, x[0] + ' ');
      span.appendChild(el('b', null, String(x[1])));
      s.appendChild(span);
    });
  }

  var FILTER_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>';

  function renderHead() {
    var cols = $('cols'), head = $('headRow');
    cols.innerHTML = '';
    head.innerHTML = '';
    COLUMNS.forEach(function (c) {
      var col = document.createElement('col');
      col.style.width = c.width;
      cols.appendChild(col);
      var th = document.createElement('th');
      var wrap = el('div', 'th');
      var sortBtn = el('button', 'th-sort', c.label);
      sortBtn.type = 'button';
      sortBtn.title = '눌러서 정렬';
      if (sort && sort.key === c.key) sortBtn.appendChild(el('span', 'arrow', sort.dir > 0 ? '▲' : '▼'));
      sortBtn.addEventListener('click', function () { toggleSort(c.key); });
      wrap.appendChild(sortBtn);
      if (c.filter) {
        var f = el('button', 'th-filter' + (isFilterOn(c.key) ? ' on' : ''));
        f.type = 'button';
        f.innerHTML = FILTER_ICON;
        f.setAttribute('aria-label', c.label + ' 필터');
        f.title = c.label + ' 필터';
        f.addEventListener('click', function (e) { e.stopPropagation(); togglePop(c, f); });
        wrap.appendChild(f);
      }
      th.appendChild(wrap);
      head.appendChild(th);
    });
  }

  function toggleSort(key) {
    if (!sort || sort.key !== key) sort = { key: key, dir: 1 };
    else if (sort.dir === 1) sort.dir = -1;
    else sort = null;
    renderHead();
    renderRows();
  }

  // ───────── 검색·필터 ─────────
  function terms(text) { return (text || '').toLowerCase().split(/\s+/).filter(Boolean); }

  // 관리 프로그램 검색과 같은 대상: 번호·제목·요청 내용·요청자·답변 (R-12)
  function searchable(r) { return [r.no, r.title, r.content, r.requester, repliesText(r)].join('\n').toLowerCase(); }

  function isFilterOn(key) {
    var f = filters[key];
    if (!f) return false;
    if (f instanceof Set) return true;
    if (typeof f === 'string') return f.trim().length > 0;
    return !!(f.from || f.to);
  }

  function passes(r, skipKey) {
    var t = terms(searchText);
    if (t.length) {
      var hay = searchable(r);
      for (var i = 0; i < t.length; i++) if (hay.indexOf(t[i]) < 0) return false;
    }
    for (var c = 0; c < COLUMNS.length; c++) {
      var col = COLUMNS[c];
      if (col.key === skipKey || !isFilterOn(col.key)) continue;
      var f = filters[col.key], v = col.value(r) || '';
      if (f instanceof Set) {
        if (!f.has(v || EMPTY)) return false;
      } else if (typeof f === 'string') {
        var tt = terms(f), lv = v.toLowerCase();
        for (var j = 0; j < tt.length; j++) if (lv.indexOf(tt[j]) < 0) return false;
      } else {
        if (f.from && v < f.from) return false;
        if (f.to && v > f.to) return false;
      }
    }
    return true;
  }

  function defaultOrder(a, b) {
    // 미완료 먼저, 그다음 최근 요청일, 같은 날이면 번호 역순
    var ca = isClosed(a) ? 1 : 0, cb = isClosed(b) ? 1 : 0;
    if (ca !== cb) return ca - cb;
    if (a.requestDate !== b.requestDate) return a.requestDate < b.requestDate ? 1 : -1;
    return a.no < b.no ? 1 : -1;
  }

  function compareBy(key) {
    if (key === 'priority') {
      return function (a, b) {
        var ra = a.type === 'inquiry' ? -1 : PRIORITY_RANK[a.priority], rb = b.type === 'inquiry' ? -1 : PRIORITY_RANK[b.priority];
        return ra - rb;
      };
    }
    var col = COLUMNS.filter(function (c) { return c.key === key; })[0];
    return function (a, b) { return (col.value(a) || '').localeCompare(col.value(b) || '', 'ko'); };
  }

  function visibleRows() {
    var list = rows.filter(function (r) { return passes(r); });
    if (sort) {
      var cmp = compareBy(sort.key);
      list.sort(function (a, b) { return cmp(a, b) * sort.dir || defaultOrder(a, b); });
    } else {
      list.sort(defaultOrder);
    }
    return list;
  }

  function renderRows() {
    var body = $('rows'), list = visibleRows();
    body.innerHTML = '';
    list.forEach(function (r) {
      var tr = document.createElement('tr');
      if (isClosed(r)) tr.className = 'closed';
      tr.title = '더블클릭하면 상세 보기';
      var typeColor = r.type === 'inquiry' ? 'var(--inquiry)' : 'var(--primary)';

      var no = el('td', 'no', r.no);
      if (!isClosed(r)) no.style.color = typeColor;
      tr.appendChild(no);

      var type = el('td');
      type.appendChild(el('span', 'tag ' + (r.type === 'inquiry' ? 'inquiry' : 'dev'), typeLabel(r)));
      tr.appendChild(type);

      tr.appendChild(el('td', 'title', r.title));
      tr.appendChild(el('td', 'pre', r.content));

      var rep = el('td');
      r.replies.forEach(function (x) {
        var line = el('div', 'reply-line');
        line.appendChild(el('span', 'rd', mmdd(x.date)));
        line.appendChild(document.createTextNode(x.message));
        rep.appendChild(line);
      });
      tr.appendChild(rep);

      tr.appendChild(el('td', null, r.requester));
      tr.appendChild(el('td', null, r.requestDate));
      var pr = el('td', r.priority === 'urgent' ? 'prio-urgent' : r.priority === 'high' ? 'prio-high' : '', priorityLabel(r));
      if (r.type === 'inquiry') pr.className = '';
      tr.appendChild(pr);
      var st = el('td');
      var badge = el('span', 'status', statusLabel(r));
      badge.style.color = STATUS_COLOR[r.status] || 'inherit';
      st.appendChild(badge);
      tr.appendChild(st);

      bindOpen(tr, r);
      body.appendChild(tr);
    });
    $('noRows').hidden = list.length > 0;
    $('result').textContent = list.length === rows.length ? '총 ' + rows.length + '건' : list.length + '건 / 전체 ' + rows.length + '건';
    $('resetAll').disabled = !searchText && !COLUMNS.some(function (c) { return isFilterOn(c.key); });
    renderChips();
  }

  function renderChips() {
    var box = $('activeFilters');
    box.innerHTML = '';
    COLUMNS.forEach(function (c) {
      if (!isFilterOn(c.key)) return;
      var f = filters[c.key], text;
      if (f instanceof Set) text = c.label + ': ' + Array.from(f).join(', ');
      else if (typeof f === 'string') text = c.label + ': "' + f.trim() + '"';
      else text = c.label + ': ' + (f.from || '처음') + ' ~ ' + (f.to || '끝');
      var chip = el('span', 'chip', text);
      var x = el('button', null, '×');
      x.type = 'button';
      x.setAttribute('aria-label', c.label + ' 필터 해제');
      x.addEventListener('click', function () { delete filters[c.key]; closePop(); renderHead(); renderRows(); });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }

  // ───────── 필터 팝업 ─────────
  function closePop() { $('pop').hidden = true; popKey = null; }

  function togglePop(col, anchor) {
    if (popKey === col.key) { closePop(); return; }
    popKey = col.key;
    var pop = $('pop');
    pop.innerHTML = '';
    pop.appendChild(el('h3', null, col.label + ' 필터'));
    if (col.filter === 'set') buildSetFilter(pop, col);
    else if (col.filter === 'text') buildTextFilter(pop, col);
    else buildDateFilter(pop, col);

    var actions = el('div', 'actions');
    var reset = el('button', 'btn', '초기화');
    reset.type = 'button';
    reset.addEventListener('click', function () { delete filters[col.key]; afterFilter(); closePop(); });
    var close = el('button', 'btn', '닫기');
    close.type = 'button';
    close.addEventListener('click', closePop);
    actions.appendChild(reset);
    actions.appendChild(close);
    pop.appendChild(actions);

    pop.hidden = false;
    var rect = anchor.getBoundingClientRect();
    var left = Math.min(window.scrollX + rect.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 12);
    pop.style.left = Math.max(12, left) + 'px';
    pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';
    var first = pop.querySelector('input');
    if (first && col.filter !== 'set') first.focus();
  }

  function afterFilter() {
    renderHead();
    renderRows();
  }

  function buildSetFilter(pop, col) {
    // 다른 조건을 적용한 상태에서의 값별 건수를 보여준다.
    var counts = {};
    rows.forEach(function (r) {
      if (!passes(r, col.key)) return;
      var v = col.value(r) || EMPTY;
      counts[v] = (counts[v] || 0) + 1;
    });
    var all = {};
    rows.forEach(function (r) { all[col.value(r) || EMPTY] = true; });
    var values = Object.keys(all).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
    var current = filters[col.key];

    var finder = null;
    if (values.length > 8) {
      finder = el('input');
      finder.type = 'text';
      finder.placeholder = '값 찾기';
      pop.appendChild(finder);
    }

    var allLabel = el('label', 'all');
    var allBox = el('input');
    allBox.type = 'checkbox';
    allBox.checked = !current;
    allLabel.appendChild(allBox);
    allLabel.appendChild(document.createTextNode('전체 선택'));

    var box = el('div', 'options');
    box.appendChild(allLabel);
    var boxes = [];
    values.forEach(function (v) {
      var label = el('label');
      var cb = el('input');
      cb.type = 'checkbox';
      cb.value = v;
      cb.checked = !current || current.has(v);
      label.appendChild(cb);
      label.appendChild(document.createTextNode(v));
      label.appendChild(el('span', 'n', String(counts[v] || 0)));
      box.appendChild(label);
      boxes.push({ cb: cb, label: label, value: v });
      cb.addEventListener('change', apply);
    });
    pop.appendChild(box);

    allBox.addEventListener('change', function () {
      boxes.forEach(function (b) { if (!b.label.hidden) b.cb.checked = allBox.checked; });
      apply();
    });
    if (finder) {
      finder.addEventListener('input', function () {
        var q = finder.value.trim().toLowerCase();
        boxes.forEach(function (b) { b.label.hidden = q && b.value.toLowerCase().indexOf(q) < 0; });
      });
    }

    function apply() {
      var selected = boxes.filter(function (b) { return b.cb.checked; }).map(function (b) { return b.value; });
      if (selected.length === values.length) delete filters[col.key];
      else filters[col.key] = new Set(selected);
      allBox.checked = selected.length === values.length;
      afterFilter();
    }
  }

  function buildTextFilter(pop, col) {
    var input = el('input');
    input.type = 'text';
    input.placeholder = '포함할 단어 (띄어 쓰면 모두 포함)';
    input.value = typeof filters[col.key] === 'string' ? filters[col.key] : '';
    input.addEventListener('input', function () {
      if (input.value.trim()) filters[col.key] = input.value;
      else delete filters[col.key];
      afterFilter();
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') closePop(); });
    pop.appendChild(input);
    pop.appendChild(el('div', 'note', '이 열에서만 찾습니다.'));
  }

  function buildDateFilter(pop, col) {
    var current = filters[col.key] || {};
    var range = el('div', 'range');
    var from = el('input'), to = el('input');
    from.type = to.type = 'date';
    from.value = current.from || '';
    to.value = current.to || '';
    range.appendChild(el('span', null, '시작일'));
    range.appendChild(from);
    range.appendChild(el('span', null, '종료일'));
    range.appendChild(to);
    pop.appendChild(range);
    function apply() {
      if (from.value || to.value) filters[col.key] = { from: from.value, to: to.value };
      else delete filters[col.key];
      afterFilter();
    }
    from.addEventListener('change', apply);
    to.addEventListener('change', apply);
  }

  // ───────── 상세 ─────────
  function openDetail(r) {
    closePop();
    $('mNo').textContent = r.no + ' · ' + typeLabel(r);
    $('mTitle').textContent = r.title;
    var meta = $('mMeta');
    meta.innerHTML = '';
    var items = [['요청자', r.requester], ['요청일', r.requestDate]];
    if (r.type !== 'inquiry') items.push(['중요도', priorityLabel(r)]);
    items.push(['상태', statusLabel(r)]);
    if (r.completedAt) items.push([r.type === 'inquiry' ? '답변 완료일' : '완료일', fmt(r.completedAt, true)]);
    items.push(['마지막 변경', fmt(r.updatedAt, true)]);
    items.forEach(function (x) {
      var d = el('div');
      d.appendChild(el('dt', null, x[0]));
      var dd = el('dd', null, x[1] || '-');
      if (x[0] === '상태') dd.style.color = STATUS_COLOR[r.status] || 'inherit';
      d.appendChild(dd);
      meta.appendChild(d);
    });
    $('mContent').textContent = r.content;
    var list = $('mReplies');
    list.innerHTML = '';
    $('mReplyTitle').textContent = '답변' + (r.replies.length ? ' (' + r.replies.length + ')' : '');
    if (!r.replies.length) list.appendChild(el('li', 'empty-text', '아직 답변이 없습니다.'));
    r.replies.forEach(function (x) {
      var li = el('li');
      li.appendChild(el('div', 'when', fmt(x.date, true) + ' · ' + x.author));
      li.appendChild(el('div', 'msg', x.message));
      list.appendChild(li);
    });
    $('modal').hidden = false;
    $('mClose').focus();
  }

  function closeDetail() { $('modal').hidden = true; }

  // ───────── 이벤트 ─────────
  var searchTimer = null;
  $('search').addEventListener('input', function (e) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { searchText = e.target.value; renderRows(); }, 120);
  });
  $('resetAll').addEventListener('click', function () {
    filters = {};
    searchText = '';
    $('search').value = '';
    closePop();
    renderHead();
    renderRows();
  });
  $('mClose').addEventListener('click', closeDetail);
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeDetail(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePop(); closeDetail(); }
  });
  document.addEventListener('click', function (e) {
    var pop = $('pop');
    if (!pop.hidden && !pop.contains(e.target)) closePop();
  });
  window.addEventListener('resize', closePop);
  // 주소의 # 뒤(업체 ID·키)만 바뀌면 페이지가 다시 열리지 않으므로 직접 새로 읽는다.
  window.addEventListener('hashchange', function () { location.reload(); });

  load();
})();
</script>
</body>
